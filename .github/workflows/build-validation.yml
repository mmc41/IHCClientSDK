name: build

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'
    - '**.props'
    - '**.vis'
    - '**.def'
    - '**.ifb'
    - '**/*.dtd'
    - 'tests/**'
    - '.github/workflows/**'
    # CsWin32's input: this file IS the list of Win32 APIs generated into the UI-automation toolkit, so adding
    # or removing a line changes compiled source without touching a .cs file anywhere.
    - '**/NativeMethods.txt'
    # Analyzer enforcement. Warnings are errors here, so a severity change alone can break the build in
    # every project without touching a single .cs file — and none of the patterns above match these names.
    - '.globalconfig'
    - '**/*.globalconfig'
    - '**/.editorconfig'
    - '**/analyser.config'
    - 'BannedSymbols.txt'

env:
  DOTNET_VERSION: '10.x' # The .NET SDK version to use

jobs:
  build:

    name: build-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Setup .NET Core
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        dotnet-quality: 'ga'

    - name: Install native render/font dependencies (Linux)
      # What Skia needs to rasterize text off-screen on a bare runner. Without these the headless Avalonia
      # suite cannot start at all, which is why it used to be skipped here.
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libice6 libsm6

    - name: Install dependencies
      run: dotnet restore

    - name: Restore local tools
      # dotnet-coverage, which merges the per-suite coverage slices into one report. It is a local
      # tool, so without this the merge step after each suite warns and produces nothing — the tests
      # themselves still run and still gate the build.
      run: dotnet tool restore

    - name: Install jscpd
      # The copy/paste scan the build runs after compiling ihcclient. It is an npm tool rather than
      # something dotnet restore brings in, so without this step every leg would log the warning the
      # build raises when jscpd is absent. Node ships on all three hosted runners, so no setup-node.
      #
      # Pinned to a major, not to a version. The scan gates nothing, so a fix inside v5 can land
      # unreviewed; a v6 that renamed a reporter or changed the config schema could not, and would
      # otherwise turn into a jscpd exit code warning on every leg. Dependabot cannot see a version
      # inside a `run:` — that is the other half of why this is a range and not a pin to maintain.
      #
      # continue-on-error, because a registry hiccup must not fail a build over an advisory tool.
      # The build then warns about the missing jscpd exactly as it does on a developer machine.
      continue-on-error: true
      # Quoted because the Windows runner runs this through PowerShell, where an unquoted ^ is at the
      # mercy of the shell rather than reaching npm as part of the range.
      run: npm install -g "jscpd@^5"

    - name: Build
      run: dotnet build --no-restore

    # Every suite below runs with the same diagnostics, and the reason is a failure we could NOT diagnose:
    # a one-in-many-runs failure in the Avalonia suite that left no artifact behind, because a TRX was
    # written only on demand and a green run wrote nothing at all. So:
    #   --logger trx        a result file for EVERY run, green ones included — the failing test is named,
    #                       with its output, instead of having to be reproduced first.
    #   --blame-hang        a test that stops making progress is reported BY NAME. A deadlock otherwise
    #                       shows up as a job that times out with no attribution whatsoever.
    #   --blame-crash       an exception escaping a POOL thread kills the host before NUnit can report
    #                       anything; blame's sequence file still names the test that was running.
    # The results are uploaded by the step at the end of the job, which runs even when a suite fails.
    #
    # None of these steps names a results directory. Directory.Build.targets gives each suite its own
    # one under artifacts/coverage/raw/<suite>/, so the TRX, the blame files and that suite's coverage
    # slice land together — and naming one here would override that and collapse every suite into a
    # shared directory, leaving the merged coverage report describing whichever ran last.

    - name: Test (controller-free unit tests)
      run: dotnet test tests/safe_unit_tests/safe_unit_tests.csproj --no-build --logger "trx;LogFileName=safe_unit_tests.trx" --blame-hang --blame-hang-timeout 120s --blame-crash

    - name: Test (architecture / dependency rules)
      # ArchUnitNET reads IL to enforce the SDK's directional layering rules; controller-free and
      # render-free, so it runs on all three OSes like the unit and project-engine suites.
      run: dotnet test tests/safe_architecture_tests/safe_architecture_tests.csproj --no-build --logger "trx;LogFileName=safe_architecture_tests.trx" --blame-hang --blame-hang-timeout 120s --blame-crash

    - name: Test (project engine byte-fidelity)
      # Controller-free .vis project engine + ProjectAppService byte-fidelity corpus (the
      # hard-constraint gate). Needs no native render/font deps (unlike the Avalonia suites),
      # so it runs on all three OSes like the unit tests.
      run: dotnet test tests/safe_project_tests/safe_project_tests.csproj --no-build --logger "trx;LogFileName=safe_project_tests.trx" --blame-hang --blame-hang-timeout 120s --blame-crash

    - name: Test (headless Lab UI tests)
      # Avalonia + Skia headless rendering is validated on the Windows runner (the primary
      # development environment). Scope here rather than risk missing native render/font deps
      # on the Linux/macOS runners. safe_lab_tests is [NonParallelizable] and uses mock:// services.
      if: matrix.os == 'windows-latest'
      run: dotnet test tests/safe_lab_tests/safe_lab_tests.csproj --no-build --logger "trx;LogFileName=safe_lab_tests.trx" --blame-hang --blame-hang-timeout 120s --blame-crash

    - name: Test (headless Visual UI tests)
      # ihc_openvisual is a CROSS-PLATFORM desktop app, so its GUI suite runs on the Linux runner too — that
      # leg is the only thing that can catch the portability defects which are invisible on Windows (a font
      # resolved from the platform instead of the embedded one, a path or accelerator assumption). macOS stays
      # out: no runner-specific need has surfaced, and the two legs already cover both native backends.
      if: matrix.os != 'macOS-latest'
      run: dotnet test tests/safe_visual_tests/safe_visual_tests.csproj --no-build --logger "trx;LogFileName=safe_visual_tests.trx" --blame-hang --blame-hang-timeout 120s --blame-crash

    - name: Test (end-to-end scenarios, headless)
      # The E2E scenarios driven through the in-process headless window instead of the real desktop. The DEFAULT
      # mode of this suite launches ihc_openvisual.exe and drives it over Windows UI Automation, which needs a
      # session to draw on and takes minutes; `headless=true` swaps the driver for one that hosts the same
      # MainWindow in this process, and the same scenarios then run in seconds on a runner.
      #
      # READ THIS BEFORE TRUSTING A GREEN RESULT HERE. The headless driver is a SECOND implementation of the verb
      # vocabulary. It does not exercise aui.ps1, and it reads Avalonia's automation peers rather than Windows
      # UIA — so it cannot see a defect in the bridge between them, which is the class of defect this suite was
      # written for. A pass here means "the scenario paths still work", never "the driver still works". The real
      # mode remains the only thing that proves the latter, and it is run deliberately on a desktop.
      #
      # TestCategory!=DesktopOnly drops the scenarios that reach a dialog's controls, the menu bar, a tree node by
      # path or the project-information window: the headless driver refuses those verbs rather than approximating
      # them, and the category makes that gap greppable in the source instead of a runtime surprise.
      #
      # Windows only, not because the driver needs it — it is Avalonia headless and cross-platform — but because
      # this leg already installs what Skia needs and the suite has only been measured here.
      #
      # The run parameter is SINGLE-QUOTED, and it is what makes this leg run at all. This step's shell is
      # PowerShell, where a bare `(` opens an argument list and the `name=` inside it is a parse error before
      # dotnet is ever launched — the step failed with "Missing argument in parameter list". Single quotes are
      # literal in PowerShell and in bash alike, so this is the one spelling every shell agrees on; the
      # backslash-escaped form the docs used works only in bash. Keep the inner double quotes: vstest's
      # runsettings-argument parser requires them around the name.
      if: matrix.os == 'windows-latest'
      run: dotnet test tests/safe_visual_e2e_tests/safe_visual_e2e_tests.csproj --no-build --filter "TestCategory!=DesktopOnly" --logger "trx;LogFileName=safe_visual_e2e_tests.trx" --blame-hang --blame-hang-timeout 120s --blame-crash -- 'TestRunParameters.Parameter(name="headless",value="true")'

    - name: Upload test results
      # always(), because the run that most needs its artifact is the one that just failed — and a green
      # run's TRX is what a later flake gets compared against.
      # The raw .coverage slices are excluded: they are large binaries that say nothing about a failure,
      # and the readable form of the same data is uploaded by the next step.
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: test-results-${{ matrix.os }}
        path: |
          artifacts/coverage/raw/**
          !artifacts/coverage/raw/**/*.coverage
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload coverage report
      # Only the Windows leg runs every suite this workflow runs, so it is the only one whose merged number
      # is worth uploading; the other legs would upload a report with suites missing from it. Not even this
      # one is repo-wide: safe_integration_tests collects and no CI leg runs it, because it needs a
      # controller. The number here is what the controller-free suites reached.
      # Carries Summary.txt, the coverage XML and the one-page HTML. The per-file HTML drill-down is
      # opt-in locally and is not generated here, so this stays small.
      if: always() && matrix.os == 'windows-latest'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: coverage-report
        path: artifacts/coverage/report/
        if-no-files-found: ignore
        retention-days: 14
