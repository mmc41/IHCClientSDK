<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="currentColor" role="img" aria-label="A request is looked up in SdkOperations by service and wire action, or answered as unmodelled. Four checks then run in order: a raw override, an injected failure, a typed answer where the stub holds a typed value, and a shape default for every other operation. The scenario tier above supplies the values the checks read, and the journal records every exchange.">
