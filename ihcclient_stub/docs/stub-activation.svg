<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 492" width="1070" height="492" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="currentColor" role="img" aria-label="In-process: one test process holds the stub, its registration and the SDK services. Launched: the stub and its loopback host run in a test or in ihcclient_stub, and the app's Main applies the switch, verifies the host's token and sends SOAP over loopback HTTP. The switch replaces the endpoint and the credentials with stub values and keeps every other setting from the file.">
<title>In-process: one test process holds the stub, its registration and the SDK services. Launched: the stub and its loopback host run in a test or in ihcclient_stub, and the app's Main applies the switch, verifies the host's token and sends SOAP over loopback HTTP. The switch replaces the endpoint and the credentials with stub values and keeps every other setting from the file.</title>
