<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 490" width="950" height="490" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif" font-size="12.5" fill="currentColor" role="img" aria-label="Client.Post first asks whether the url is a stub endpoint. If so it routes to the registered in-process or loopback stub, or refuses when none is registered. Otherwise an explicit test transport wins, then the latch refuses sockets while any stub is registered, and only then does the shared socket client reach a real controller.">
<title>Client.Post first asks whether the url is a stub endpoint. If so it routes to the registered in-process or loopback stub, or refuses when none is registered. Otherwise an explicit test transport wins, then the latch refuses sockets while any stub is registered, and only then does the shared socket client reach a real controller.</title>
