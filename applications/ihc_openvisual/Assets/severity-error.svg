<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- The cross carries the signal ink (ErrorBrush's light-theme red); the ring keeps the theme's ink so the
       glyph still reads against a dark surface. See icons_design.md §5. -->
  <circle id="ring" cx="12" cy="12" r="9"/>
  <line id="cross-a" x1="8.4" y1="8.4" x2="15.6" y2="15.6" stroke="#B91C1C"/>
  <line id="cross-b" x1="15.6" y1="8.4" x2="8.4" y2="15.6" stroke="#B91C1C"/>
</svg>
