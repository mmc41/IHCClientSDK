<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- A fault in the TOOL, not in the project. The frame keeps the theme ink so the glyph reads on a dark
       surface, and only the bolt carries the failure red - the whole-glyph colouring is severity-fatal's alone.
       The silhouette is deliberately a SQUARE: Internal sorts directly above Fatal, so the two sit adjacent in
       the icon column and must be told apart at row size by outline, not by reading the mark inside.
       See icons_design.md 5.1. -->
  <rect id="frame" x="3.5" y="3.5" width="17" height="17" rx="2.5"/>
  <polyline id="bolt" points="13.8,7 9.4,12.6 12.6,12.6 10.2,17" stroke="#B91C1C"/>
</svg>
